name: CI/CD — build & deploy (test)

on:
  push:
    branches:
      - test # change to ''main'' if you want to deploy from main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /var/www/ci-cd-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps and build
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile
          yarn build || echo "no build step"

      - name: Package release (stable)
        # This step prefers packaging the built folder (dist/ or build/) to avoid tar
        # reading files that are changing. If no build dir exists, use git archive.
        run: |
          set -e
          rm -f release.tar.gz || true

          # if you have a built output folder (dist or build), package only that
          if [ -d dist ]; then
            echo "Packaging dist/ into release.tar.gz"
            rsync -a --delete --exclude=node_modules --exclude=.git dist/ /tmp/release/
            tar -C /tmp/release -czf release.tar.gz .
          elif [ -d build ]; then
            echo "Packaging build/ into release.tar.gz"
            rsync -a --delete --exclude=node_modules --exclude=.git build/ /tmp/release/
            tar -C /tmp/release -czf release.tar.gz .
          else
            # fallback: use git archive of tracked files at HEAD (safe for CI)
            echo "No build/ or dist/ found — using git archive of tracked files"
            git archive -o release.tar.gz --format=tar.gz HEAD
          fi

          ls -lh release.tar.gz || true

      - name: Ensure remote deploy dir exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}
            chown -R ${{ secrets.SSH_USER }}:$${{ secrets.SSH_USER }} ${{ env.DEPLOY_PATH }} || true
            echo "Remote path ensured: ${{ env.DEPLOY_PATH }}"

      - name: Upload release to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.tar.gz"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy on server (extract, install, chown, restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # extract uploaded archive
            tar -xzf release.tar.gz || (echo "extract failed" && exit 1)
            rm -f release.tar.gz || true

            # ensure deploy owns the files (fix permissions)
            chown -R deploy:deploy ${{ env.DEPLOY_PATH }} || true

            # install production dependencies (try yarn, else npm)
            if command -v yarn >/dev/null 2>&1; then
              yarn install --frozen-lockfile --production || true
            else
              npm ci --only=production || true
            fi

            # restart with pm2 (adjust name/script if needed)
            pm2 restart ci-cd-test || pm2 start npm --name "ci-cd-test" -- start || echo "pm2 start failed"
            pm2 save || true

            echo "Deploy finished: $(date)"
