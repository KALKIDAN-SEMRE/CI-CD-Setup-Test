name: CI/CD — build & deploy (test)

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /var/www/ci-cd-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps (runner) and attempt build (if present)
        run: |
          npm install -g yarn
          # Install dependencies for CI/build on runner
          # If you prefer npm, replace with `npm ci`
          yarn install --frozen-lockfile

          # Try to run build *if* a build script exists; if not, continue
          if yarn -s run | grep -q 'build'; then
            echo "build script found, running yarn build"
            yarn build
          else
            echo "no build script found; skipping build"
          fi

      - name: Package release
        run: |
          set -e
          rm -f release.tar.gz || true
          rm -rf /tmp/release || true
          mkdir -p /tmp/release

          # Prefer build/dist if present
          if [ -d dist ]; then
            echo "Packaging dist/ into release.tar.gz"
            rsync -a --delete --exclude=node_modules --exclude=.git dist/ /tmp/release/
            tar -C /tmp/release -czf release.tar.gz .
          elif [ -d build ]; then
            echo "Packaging build/ into release.tar.gz"
            rsync -a --delete --exclude=node_modules --exclude=.git build/ /tmp/release/
            tar -C /tmp/release -czf release.tar.gz .
          else
            echo "No build/ or dist/ found — packaging tracked files from HEAD"
            git archive -o release.tar.gz --format=tar.gz HEAD
          fi

          ls -lh release.tar.gz || true

      - name: Ensure remote deploy dir exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}
            chown -R deploy:deploy ${{ env.DEPLOY_PATH }} || true
            echo "Remote path ensured: ${{ env.DEPLOY_PATH }}"

      - name: Upload release to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.tar.gz"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy on server (extract, install, chown, restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # extract uploaded archive
            tar -xzf release.tar.gz || (echo "extract failed" && exit 1)
            rm -f release.tar.gz || true

            # ensure deploy owns the files (fix permissions)
            chown -R deploy:deploy ${{ env.DEPLOY_PATH }} || true

            # install production dependencies on server
            if command -v yarn >/dev/null 2>&1; then
              yarn install --frozen-lockfile --production || true
            else
              npm ci --only=production || true
            fi

            # restart using ecosystem.config.js (use .js name)
            pm2 restart /var/www/ci-cd-test/ecosystem.config.js --update-env || \
            pm2 start /var/www/ci-cd-test/ecosystem.config.js --update-env || \
            echo "PM2 start/restart failed"

            pm2 save || true

            echo "Deploy finished: $(date)"
